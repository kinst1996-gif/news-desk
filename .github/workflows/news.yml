name: News refresh
# Rebuilds the news feed, pictures and hashtags every hour (about 2 minutes; pictures are reused).
# Minute 20 avoids the top of the hour, when GitHub delays scheduled runs the most.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
concurrency:
  group: news-refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: sudo apt-get install -y -qq fonts-dejavu-core > /dev/null || true
      - name: Build news data and pictures
        run: python build_site.py
      - name: Publish
        env: { COMMIT_MSG: "news update" }
        run: bash push.sh data img
